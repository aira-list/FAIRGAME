# Example values for the FAIRGAME Helm chart. Replace the registry and host
# placeholders with your own before deploying.
image:
  repository: registry.example.com/your-org/fairgame
  tag: dev
  pullPolicy: Always
  pullSecret: registry-pull-secret

service:
  type: ClusterIP
  port: 4263  # "GAME" on a phone keypad — matches the app's default port

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: public
  rules:
    - host: fairgame.example.com
      http:
        paths:
          - backend:
              service:
                name: fairgame
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - fairgame.example.com
      secretName: fairgame-tls

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

application:
  health: /api/health
  env: |
    - name: ENVIRONMENT
      value: "production"
    - name: LLM_FACTORY_URL
      value: "http://llmfactory:5001"
